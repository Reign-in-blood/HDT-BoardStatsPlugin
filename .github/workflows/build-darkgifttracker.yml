name: Build Dark Gift Tracker

on:
  push:
    branches:
      - darkgifttracker-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Decode project sources
        shell: pwsh
        run: |
          $base64 = Get-Content "DarkGiftTracker/HDT_DarkGiftTracker_Source.zip.b64" -Raw
          $zipPath = Join-Path $env:RUNNER_TEMP "HDT_DarkGiftTracker_Source.zip"
          [System.IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($base64.Trim()))
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$env:GITHUB_WORKSPACE/DarkGiftTracker/build" -Force

      - name: Apply v0.6 source patch
        shell: pwsh
        run: |
          $patchBase64 = Get-Content "DarkGiftTracker/v0.6.patch.gz.b64" -Raw
          $compressedPath = Join-Path $env:RUNNER_TEMP "v0.6.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "v0.6.patch"
          [System.IO.File]::WriteAllBytes($compressedPath, [Convert]::FromBase64String($patchBase64.Trim()))

          $input = [System.IO.File]::OpenRead($compressedPath)
          $output = [System.IO.File]::Create($patchPath)
          try {
            $gzip = New-Object System.IO.Compression.GZipStream($input, [System.IO.Compression.CompressionMode]::Decompress)
            try { $gzip.CopyTo($output) }
            finally { $gzip.Dispose() }
          }
          finally {
            $output.Dispose()
            $input.Dispose()
          }

          $projectDir = "$env:GITHUB_WORKSPACE/DarkGiftTracker/build/HDT_DarkGiftTracker_Project"
          Push-Location $projectDir
          try {
            git apply --unsafe-paths -p4 $patchPath
          }
          finally {
            Pop-Location
          }

      - name: Download HDT 1.55.0 assemblies
        shell: pwsh
        run: |
          $url = "https://github.com/HearthSim/Hearthstone-Deck-Tracker/releases/download/v1.55.0/Hearthstone.Deck.Tracker-v1.55.0.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "HDT-v1.55.0.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "HDT-v1.55.0"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force

          $managedAssemblies = foreach ($file in Get-ChildItem -Path $extractPath -File -Recurse) {
            if ($file.Extension -notin @('.exe', '.dll')) { continue }
            try {
              $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName)
              [PSCustomObject]@{
                File = $file
                AssemblyName = $assemblyName.Name
              }
            }
            catch {
              # Ignore native executables and non-managed DLLs.
            }
          }

          $hdtAssembly = $managedAssemblies |
            Where-Object { $_.AssemblyName -eq 'HearthstoneDeckTracker' } |
            Select-Object -First 1

          $hearthDbAssembly = $managedAssemblies |
            Where-Object { $_.AssemblyName -eq 'HearthDb' } |
            Select-Object -First 1

          if ($null -eq $hdtAssembly) {
            Write-Host 'Managed assemblies found:'
            $managedAssemblies | Format-Table AssemblyName, @{Label='Path'; Expression={$_.File.FullName}} -AutoSize
            throw 'Managed HearthstoneDeckTracker assembly not found in release archive.'
          }

          if ($null -eq $hearthDbAssembly) {
            throw 'Managed HearthDb assembly not found in release archive.'
          }

          Write-Host "HDT assembly: $($hdtAssembly.File.FullName)"
          Write-Host "HearthDb assembly: $($hearthDbAssembly.File.FullName)"

          $projectDir = "$env:GITHUB_WORKSPACE/DarkGiftTracker/build/HDT_DarkGiftTracker_Project"
          New-Item -ItemType Directory -Path "$projectDir/lib" -Force | Out-Null
          Copy-Item -LiteralPath $hdtAssembly.File.FullName -Destination "$projectDir/lib/HearthstoneDeckTracker.exe" -Force
          Copy-Item -LiteralPath $hearthDbAssembly.File.FullName -Destination "$projectDir/lib/HearthDb.dll" -Force

      - name: Build plugin
        shell: pwsh
        run: |
          $project = "$env:GITHUB_WORKSPACE/DarkGiftTracker/build/HDT_DarkGiftTracker_Project/HDT_DarkGiftTracker.csproj"
          msbuild $project /t:Restore,Build /p:Configuration=Release /p:Platform=x64 /m

      - name: Prepare artifact
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE/DarkGiftTracker/build/HDT_DarkGiftTracker_Project/bin/Release/HDT_DarkGiftTracker.dll"
          if (-not (Test-Path -LiteralPath $source)) { throw "HDT_DarkGiftTracker.dll was not generated." }
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/artifact" -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination "$env:GITHUB_WORKSPACE/artifact/HDT_DarkGiftTracker.dll" -Force
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/DarkGiftTracker/build/HDT_DarkGiftTracker_Project/README.txt" -Destination "$env:GITHUB_WORKSPACE/artifact/README.txt" -Force

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: HDT_DarkGiftTracker
          path: artifact/*
          if-no-files-found: error
